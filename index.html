<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Sapna Devi ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- Loading Screen -->

    <div id="loading">

        <h1>Preparing A Special Surprise ❤️</h1>

        <div class="loader">

            <div class="progress"></div>

        </div>

    </div>

    <!-- Congratulations Screen -->

    <section id="welcome" class="hide">

        <h1 class="glow">

            🎉 Congratulations 🎉

        </h1>

        <p>

            A Beautiful Surprise Is Waiting For You ❤️

        </p>

        <img src="images/gift.png" class="gift" alt="Gift Box">

        <div class="buttons">

            <button id="openBtn">

                🎁 Open

            </button>

            <button id="ignoreBtn">

                ❌ Ignore

            </button>

        </div>

    </section>

    <!-- Birthday Section -->

    <section id="birthday" class="hide">

        <h1>

            ❤️ Happy Birthday <br>

            Sapna Devi ❤️

        </h1>

        <p class="subtitle">

            Today is all about your smile,
            your happiness,
            and celebrating the wonderful person you are.

        </p>
                <!-- Memory Gallery -->

        <div class="gallery">

            <img src="images/photo1.jpg" alt="Photo 1">

            <img src="images/photo2.jpg" alt="Photo 2">

            <img src="images/photo3.jpg" alt="Photo 3">

            <img src="images/photo4.jpg" alt="Photo 4">

            <img src="images/photo5.jpg" alt="Photo 5">

        </div>

        <!-- Letter Button -->

        <button id="letterBtn">

            💌 Read My Letter

        </button>

        <!-- Hidden Letter -->

        <div id="letter" class="hide">

            <h2>❤️ A Message For You ❤️</h2>

            <p id="typingText"></p>

        </div>

        <!-- Cake Section -->

        <div class="cake-section">

            <img src="images/cake.png" class="cake" alt="Birthday Cake">

            <button id="blowBtn">

                🕯️ Blow The Candles

            </button>

        </div>

    </section>

    <!-- Background Music -->

    <audio id="music" loop>

        <source src="music/birthday.mp3" type="audio/mpeg">

    </audio>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
